[project]
name = "graph_hdc"
version = "0.1.0"
requires-python = ">=3.11"
description = "Graph HDC"
authors = [
    { name = "Arvand Kaveh", email = "arvand.kaveh@tuta.com" },
    { name = "Jonas Teufel", email = "jonseb1998@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "pytorch-lightning>=2.5.5",
    "torch-geometric>=2.6.0",
    "numpy>=1.26.4,<2",
    "matplotlib>=3.9.1",
    "networkx>=3.5,<4",
    "scikit-learn",
    "seaborn>=0.13.2",
    "torch-hd==5.8.4",
    "normflows>=1.7.3",
    "fcd-torch>=1.0.7",
    "rdkit>=2024.0.0",
    "defog @ git+https://github.com/the16thpythonist/DeFoG",
    "pycomex @ git+https://github.com/the16thpythonist/pycomex",
    "flow-matching",
    "torchdiffeq",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.0.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.5.1",
    "torchvision>=0.20.0",
]
cuda = [
    "torch>=2.5.1",
    "torchvision>=0.20.0",
]
cuda128 = [
    "torch>=2.5.1",
    "torchvision>=0.20.0",
]
dev = [
    "ruff>=0.12.0",
    "pytest>=8.4.0",
    "nox>=2024.4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["graph_hdc"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "experiments/",
    "data/",
]

# uv configuration for PyTorch CPU/CUDA handling.
# Install:
#   uv sync --extra cpu                           # CPU-only
#   uv sync --extra cuda                          # cu126 wheel
#   uv sync --extra cuda128                       # cu128 wheel (default for local + uc3 cluster)
# On uc3 (BWUNICLUSTER 3.0) the cu128 wheel ships its own CUDA runtime; the
# `module load devel/cuda` inside the slurm wrap only needs to provide a
# compatible driver. See experiments/rrwp_retrieval/cluster/README.md.
[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
        { extra = "cuda128" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
    { index = "pytorch-cu128", extra = "cuda128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
    { index = "pytorch-cu128", extra = "cuda128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
